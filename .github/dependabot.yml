# 依赖更新：github-actions 与 npm。
# 口径来自治理标准 §12.5 / §19.1：cooldown.default-days >= 7（避开上游刚发布即升级的投毒窗口，
# 安全补丁不受冷却影响）；github-actions 生态的 cooldown 只支持 default-days，写 semver-*-days 会被判配置非法。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # @deepseek-ai/schemastery >= 3.18 的声明含未导出 unique symbol（kSchema），
    # 依赖方 tsc/tscdown 的 declaration emit 报 TS2883 无法命名（本仓 src/deployment.ts Config）。
    # 上游导出该类型前忽略其升级；解除条件：schemastery 导出 Schema 类型或 kSchema 符号。
    ignore:
      - dependency-name: "@deepseek-ai/schemastery"
        versions: [">= 3.18"]
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
