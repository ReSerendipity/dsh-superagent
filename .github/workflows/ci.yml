# 远端载体（治理标准 §20.1）：typecheck、构建一致性检查与全量测试必须在推送 / PR 上跑，
# 不依赖维护者本机。本仓是独立维护的跨平台发行版，Windows / macOS / Linux 都是目标平台，
# 因此同一套检查在三个 runner 上都执行；Windows 仍是回归基线，不是唯一平台。
# 公开仓的分钟数走免费额度，故周检在转公开后再加 schedule。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, tests (${{ matrix.os }})
    # Windows, macOS and Linux are all target platforms, so run the same suite on each. `fail-fast: false`
    # keeps every platform's result visible instead of cancelling the rest after the first failure.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # A git install serves `lib/` as committed, so a green test run alone does not prove that
      # lib matches src. Fail when the fresh build changed the tracked build output. `shell: bash`
      # runs Git Bash on Windows, so one POSIX script covers all three runners.
      - name: Committed lib matches a fresh build
        shell: bash
        run: |
          dirty=$(git status --porcelain -- lib)
          if [ -n "$dirty" ]; then
            echo 'lib/ is stale - rebuild and commit it.'
            git diff --stat -- lib
            echo "$dirty"
            exit 1
          fi
          echo 'lib/ is what a git install serves'
      - run: pnpm vitest run
